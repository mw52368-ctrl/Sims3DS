      - name: Build sims.3dsx with devkitPro
        shell: bash
        run: |
          set -euo pipefail
          test -x "$DEVKITARM/bin/arm-none-eabi-g++"
          make -C src/platform/3ds -j2
          test -s src/platform/3ds/sims.3dsx
          test "$(head -c4 src/platform/3ds/sims.3dsx)" = 3DSX
          echo 'Created playable-format 3DSX file; not yet hardware tested.'

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Sims3DS-O3DSXL-Renderer-Experimental
          path: |
            src/platform/3ds/sims.3dsx
            src/platform/3ds/sims.smdh
          if-no-files-found: error
          retention-days: 30
