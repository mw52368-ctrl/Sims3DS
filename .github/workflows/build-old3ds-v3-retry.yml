      - name: Build Old 3DS XL playable .3dsx
        shell: bash
        run: |
          set -euo pipefail
          make -C src/platform/3ds -j2
          test -s src/platform/3ds/sims.3dsx
          test "$(head -c4 src/platform/3ds/sims.3dsx)" = '3DSX'
          mkdir -p /tmp/artifact/3ds/sims_v3_ultra
          cp src/platform/3ds/sims.3dsx /tmp/artifact/3ds/sims_v3_ultra/sims.3dsx
          if test -f src/platform/3ds/sims.smdh; then cp src/platform/3ds/sims.smdh /tmp/artifact/3ds/sims_v3_ultra/sims.smdh; fi
          cat > /tmp/artifact/INSTALL.txt <<'EOF'
          Sims3DS V3 Old 3DS XL - MINIMUM GRAPHICS (experimental)
          Backup existing sims.3dsx and all saves first.
          Copy 3ds/sims_v3_ultra/ folder to SD:/3ds/sims_v3_ultra/
          Your legitimate game data remains in SD:/3ds/sims/.
          Launch this build from Homebrew Launcher (choose the one in sims_v3_ultra).
          SELECT + D-pad LEFT  = Minimum graphics (default on Old 3DS XL)
          SELECT + D-pad RIGHT = Better graphics (V1-like Sims)
          Both screens and sound remain enabled.
          Not hardware tested; if it crashes, return to your previous working version.
          EOF
      - name: Upload the finished build
        uses: actions/upload-artifact@v4
        with:
          name: Sims3DS-O3DSXL-V3-Minimum-Play-Test
          path: /tmp/artifact/
          retention-days: 30
          if-no-files-found: error
